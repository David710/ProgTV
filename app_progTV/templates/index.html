<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgTV — Votre guide TV</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar bg-body-tertiary" aria-label="Choisir une période">
        <div class="container-fluid justify-content-center gap-2 flex-wrap">
            <button type="button" class="btn btn-outline-primary" data-view="now">Maintenant</button>
            <button type="button" class="btn btn-outline-primary" data-view="tonight">Ce soir</button>
            <button type="button" class="btn btn-outline-primary" data-view="tomorrow">Demain</button>
            <button type="button" class="btn btn-outline-primary" data-view="suggestions">Suggestions</button>
        </div>
    </nav>
    <div id="program-container" class="container">
        <h1 id="page-title">ProgTV</h1>
        <form id="filters" class="filters mb-3" role="search" aria-label="Filtrer les programmes">
            <div>
                <label for="search" class="form-label">Recherche</label>
                <input id="search" name="q" type="search" class="form-control" placeholder="Titre, résumé, genre…" maxlength="200">
            </div>
            <div>
                <label for="channel" class="form-label">Chaîne</label>
                <select id="channel" name="channel" class="form-select"><option value="">Toutes les chaînes</option></select>
            </div>
            <div>
                <label for="category" class="form-label">Catégorie</label>
                <select id="category" name="category" class="form-select"><option value="">Toutes les catégories</option></select>
            </div>
            <div>
                <label for="max-duration" class="form-label">Durée maximale (min)</label>
                <input id="max-duration" name="max_duration" type="number" min="1" max="1440" step="1" class="form-control" placeholder="Sans limite">
            </div>
            <button id="reset-filters" type="button" class="btn btn-outline-secondary">Réinitialiser</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <div id="programs" class="program-grid"></div>
    </div>


    <!-- Link to the external JavaScript file -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
